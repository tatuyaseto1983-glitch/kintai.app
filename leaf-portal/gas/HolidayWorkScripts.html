<script>
/* ============================================================
 * HolidayWorkScripts.html — 休日出勤申請の動き（スタッフ画面）
 *
 * 画面の分け方（新規申請と、既存申請の取り消しを混ぜない）
 *   ・申請状況（holidayWorkModal）…「新しく申請する」「申請中・承認済み」「過去の申請」の3区分
 *   ・新規申請（hwFormModal）……… ［＋休日出勤を申請］／［休日出勤を申請する］から開く。取消の項目は出さない
 *   ・申請を取り下げる（hwWithdrawModal）… 承認前の申請。すぐ取消済み
 *   ・取消申請（hwCancelModal）…… 承認済みの申請。取消理由は必須。管理者が確認する
 *
 * ・申請できるか（休日出勤申請対象か）はサーバーが判定します。対象外ならカードを出しません
 * ・社員ID・氏名は画面から送りません（サーバーがログイン中の社員で決めます）
 * ・表示する文字はすべて textContent で入れています（HTMLとして解釈しないので安全）
 * ・処理中は全ボタンを無効化し、連打しても1回だけ送ります
 * ============================================================ */
(function () {
  'use strict';

  var App = window.LeafApp;
  var el = App.el;

  /** 休日出勤申請の画面から呼んでよいサーバーの関数（管理者用の関数は入れない） */
  var HW_FUNCTIONS = ['getMyHolidayWorkRequests', 'submitHolidayWorkRequest', 'withdrawHolidayWorkRequest', 'requestHolidayWorkCancellation'];
  var STATUS = { PENDING: '申請中', APPROVED: '承認済み', REJECTED: '却下', CANCEL_REQUESTED: '取消申請中', CANCELLED: '取消済み' };
  var COMP_PLANNED = '取得予定';
  var MODALS = ['holidayWorkModal', 'hwFormModal', 'hwWithdrawModal', 'hwCancelModal'];

  var H = { busy: false, data: null, seq: 0, formFromHub: false, target: null };

  function $(id) { return document.getElementById(id); }
  function call(fn, args) { return App.callAllowed(HW_FUNCTIONS, fn, args); }
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function toMinutes(text) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(text || '');
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function today() { return (H.data && H.data.today) || App.getServerDate() || App.jstDateKey(new Date()); }
  function rangeText(r) { return r.plannedStart + '〜' + r.plannedEnd; }
  function compText(r) {
    if (r.compDayType !== COMP_PLANNED) return r.compDayType || '—';
    return COMP_PLANNED + '（' + (r.compDayDate ? App.formatDateShort(r.compDayDate) : '日付未定') + '）';
  }

  /**
   * 申請中・承認済み：申請中・取消申請中（日付に関係なく）と、休日出勤日が今日以降の承認済み
   * 過去の申請：却下・取消済みと、休日出勤日が過ぎた承認済み
   */
  function isActive(r) {
    if (r.status === STATUS.PENDING || r.status === STATUS.CANCEL_REQUESTED) return true;
    return r.status === STATUS.APPROVED && r.workDate >= today();
  }

  // ============================================================ 取得・表示

  function load() {
    var seq = ++H.seq;
    return call('getMyHolidayWorkRequests', []).then(function (res) {
      if (seq !== H.seq) return res;
      if (!res.success || !res.data || !res.data.eligible) {
        // 未登録・対象外・準備中（setupSystem 前）はカードを出さない
        H.data = res.success ? res.data : null;
        $('holidayWorkCard').hidden = true;
        return res;
      }
      H.data = res.data;
      $('holidayWorkCard').hidden = false;
      render();
      return res;
    });
  }

  function statusBadge(status) {
    var cls = status === STATUS.PENDING ? 'badge-warn' : status === STATUS.APPROVED ? 'badge-ok' : status === STATUS.REJECTED ? 'badge-ng'
      : status === STATUS.CANCEL_REQUESTED ? 'badge-warn' : 'badge-notstarted';
    return el('span', 'badge ' + cls, status);
  }

  function render() {
    var requests = (H.data && H.data.requests) || [];
    var active = requests.filter(isActive).sort(function (a, b) { return a.workDate < b.workDate ? -1 : a.workDate > b.workDate ? 1 : 0; });
    var past = requests.filter(function (r) { return !isActive(r); });

    // スタッフ画面のカード：これからの申請（3件）
    var mini = $('holidayWorkMiniList');
    mini.textContent = '';
    active.slice(0, 3).forEach(function (r) {
      var li = document.createElement('li');
      li.appendChild(el('span', '', App.formatDateShort(r.workDate) + '　' + rangeText(r)));
      li.appendChild(statusBadge(r.status));
      mini.appendChild(li);
    });

    fillCards($('hwActiveList'), active, '申請中・承認済みの申請はありません');
    fillCards($('hwPastList'), past, '過去の申請はありません');
  }

  function fillCards(box, list, emptyText) {
    box.textContent = '';
    if (!list.length) { box.appendChild(el('p', 'empty', emptyText)); return; }
    list.forEach(function (r) { box.appendChild(requestCard(r)); });
  }

  function requestCard(r) {
    var card = el('div', 'hw-card');
    card.setAttribute('data-request-id', r.requestId);
    var head = el('div', 'hw-card-head');
    head.appendChild(el('span', 'hw-card-date', App.formatDateShort(r.workDate)));
    head.appendChild(statusBadge(r.status));
    card.appendChild(head);

    var dl = el('dl', 'hw-card-info');
    addInfo(dl, '予定時間帯', rangeText(r) + '（予定拘束 ' + App.trimHour(r.plannedSpan) + '）');
    addInfo(dl, '振替休日', compText(r));
    addInfo(dl, '休日出勤理由', r.reason);
    if (r.status === STATUS.REJECTED && r.rejectReason) addInfo(dl, '却下理由', r.rejectReason);
    if (r.status === STATUS.CANCEL_REQUESTED) addInfo(dl, '取消理由', r.cancelReason);
    if (r.status === STATUS.CANCELLED) addInfo(dl, '取消', (r.cancelApprovedAt || '').slice(0, 16) + '　' + (r.cancelReason || ''));
    card.appendChild(dl);

    if (r.status === STATUS.CANCEL_REQUESTED) card.appendChild(el('p', 'hw-card-note', '取消を申請中です（管理者の確認待ち）。'));
    if (r.status === STATUS.APPROVED && r.cancelRejectReason) card.appendChild(el('p', 'hw-card-note is-error', '取消申請は却下されました：' + r.cancelRejectReason));

    var actions = el('div', 'hw-actions');
    if (r.status === STATUS.PENDING) actions.appendChild(actionButton('申請を取り下げる', 'btn-outline js-hw-withdraw', function () { openWithdraw(r); }));
    if (r.status === STATUS.APPROVED && r.workDate >= today()) actions.appendChild(actionButton('取消申請', 'btn-outline js-hw-cancel', function () { openCancel(r); }));
    if (actions.children.length) card.appendChild(actions);
    return card;
  }

  function addInfo(dl, label, value) {
    dl.appendChild(el('dt', '', label));
    dl.appendChild(el('dd', '', value || '—'));
  }

  function actionButton(label, cls, onClick) {
    var b = el('button', 'btn btn-sm ' + cls, label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }

  // ============================================================ 申請状況

  function openHub() {
    if (!H.data || !H.data.eligible) return;
    render();
    App.openModal('holidayWorkModal');
    $('btnHwNew').focus();
  }

  // ============================================================ 新規申請

  function openForm(fromHub) {
    if (!H.data || !H.data.eligible) return;
    H.formFromHub = !!fromHub;
    if (fromHub) $('holidayWorkModal').hidden = true;
    var user = App.getUser();
    $('holidayWorkForm').reset();
    $('hwApplicant').value = user ? user.name + '（' + user.employeeId + '）' : '';
    $('hwDate').min = today(); // 事前申請なので過去日は選べない（サーバー側でも拒否）
    $('hwCompDate').min = today();
    $('hwStart').value = '09:00';
    $('hwEnd').value = '';
    updateCompDate();
    updateSpan();
    App.openModal('hwFormModal');
    $('hwDate').focus();
  }

  /** フォームを閉じる（申請状況から開いたときは申請状況に戻る） */
  function closeForm() {
    App.closeModal('hwFormModal');
    if (H.formFromHub) openHub();
    H.formFromHub = false;
  }

  /** 開始・終了から、予定時間帯と予定拘束時間（休憩を差し引かない）を表示する */
  function updateSpan() {
    var start = toMinutes($('hwStart').value);
    var end = toMinutes($('hwEnd').value);
    var note = $('hwSpanNote');
    var problem = '';
    $('hwRangeText').textContent = ($('hwStart').value || '--:--') + ' 〜 ' + ($('hwEnd').value || '--:--');
    if (start === null || end === null) {
      $('hwSpanText').textContent = '--:--';
    } else if (end <= start) {
      $('hwSpanText').textContent = '--:--';
      problem = '終了予定時刻は、開始予定時刻より後にしてください（日付をまたぐ休日出勤は申請できません）。';
    } else {
      var span = end - start;
      $('hwSpanText').textContent = Math.floor(span / 60) + ':' + pad2(span % 60);
    }
    note.textContent = problem;
    note.hidden = !problem;
    note.classList.toggle('is-error', !!problem);
    return problem;
  }

  /** 振替休日予定日は「取得予定」のときだけ表示する（それ以外は値を消す） */
  function updateCompDate() {
    var planned = $('hwCompType').value === COMP_PLANNED;
    $('hwCompDateRow').hidden = !planned;
    if (!planned) $('hwCompDate').value = '';
  }

  function collect() {
    return {
      workDate: $('hwDate').value,
      plannedStart: $('hwStart').value,
      plannedEnd: $('hwEnd').value,
      reason: $('hwReason').value.trim(),
      content: $('hwContent').value.trim(),
      compDayType: $('hwCompType').value,
      compDayDate: $('hwCompType').value === COMP_PLANNED ? $('hwCompDate').value : '',
      note: $('hwNote').value.trim(),
    };
  }

  /** 送る前の確認（最終的なチェックはサーバー側で必ず行う） */
  function checkBeforeSubmit(req) {
    if (!req.workDate) return '休日出勤日を入力してください';
    if (req.workDate < today()) return '過去の日付は申請できません';
    if (!req.plannedStart) return '開始予定時刻を入力してください';
    if (!req.plannedEnd) return '終了予定時刻を入力してください';
    var spanProblem = updateSpan();
    if (spanProblem) return spanProblem;
    if (!req.reason) return '休日出勤理由を入力してください';
    if (!req.content) return '業務内容を入力してください';
    if (!req.compDayType) return '振替休日区分を選んでください';
    if (req.compDayDate && req.compDayDate === req.workDate) return '振替休日予定日は、休日出勤日と別の日にしてください';
    if (req.compDayDate && req.compDayDate < today()) return '振替休日予定日に過去の日付は指定できません';
    return '';
  }

  function onSubmit(event) {
    event.preventDefault();
    var req = collect();
    var problem = checkBeforeSubmit(req);
    if (problem) { App.showToast('warn', problem); return; }
    act($('btnSubmitHolidayWork'), 'submitHolidayWorkRequest', [req], '申請中...').then(function (res) {
      if (!res || !res.success) return;
      load().then(closeForm);
    });
  }

  // ============================================================ 申請を取り下げる（承認前）／取消申請（承認後）

  function fillTarget(dl, r) {
    dl.textContent = '';
    addInfo(dl, '休日出勤日', App.formatDateShort(r.workDate));
    addInfo(dl, '予定時間帯', rangeText(r));
    addInfo(dl, '休日出勤理由', r.reason);
  }

  function openWithdraw(r) {
    if (H.busy) return;
    H.target = r;
    fillTarget($('hwWithdrawTarget'), r);
    App.openModal('hwWithdrawModal');
    $('btnHwWithdrawBack').focus();
  }

  function onWithdraw() {
    var r = H.target;
    if (!r || H.busy) return;
    act($('btnHwWithdrawOk'), 'withdrawHolidayWorkRequest', [r.requestId], '処理中...').then(function (res) {
      if (!res || !res.success) return;
      H.target = null;
      App.closeModal('hwWithdrawModal');
      load();
    });
  }

  function openCancel(r) {
    if (H.busy) return;
    H.target = r;
    fillTarget($('hwCancelTarget'), r);
    $('hwCancelReason').value = '';
    App.openModal('hwCancelModal');
    $('hwCancelReason').focus();
  }

  function onCancelRequest() {
    var r = H.target;
    if (!r || H.busy) return;
    var reason = $('hwCancelReason').value.trim();
    if (!reason) { App.showToast('warn', '取消理由を入力してください'); $('hwCancelReason').focus(); return; }
    act($('btnHwCancelOk'), 'requestHolidayWorkCancellation', [r.requestId, reason], '申請中...').then(function (res) {
      if (!res || !res.success) return;
      H.target = null;
      App.closeModal('hwCancelModal');
      load();
    });
  }

  function closeDialog(id) {
    if (H.busy) return;
    H.target = null;
    App.closeModal(id);
  }

  // ============================================================ 操作の共通処理

  function setBusy(isBusy, button, busyText) {
    H.busy = isBusy;
    document.body.classList.toggle('is-busy', isBusy);
    var selector = ['#holidayWorkCard'].concat(MODALS.map(function (id) { return '#' + id; })).map(function (s) { return s + ' button'; }).join(', ');
    var buttons = document.querySelectorAll(selector);
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (isBusy) {
        if (!b.hasAttribute('data-was-disabled')) b.setAttribute('data-was-disabled', b.disabled ? '1' : '');
        b.disabled = true;
        if (b === button) { b.setAttribute('data-original-label', b.textContent); b.textContent = busyText || '処理中...'; }
      } else {
        if (b.hasAttribute('data-original-label')) { b.textContent = b.getAttribute('data-original-label'); b.removeAttribute('data-original-label'); }
        b.disabled = b.getAttribute('data-was-disabled') === '1';
        b.removeAttribute('data-was-disabled');
      }
    }
  }

  /** サーバーの処理を1回だけ実行して通知する */
  function act(button, fn, args, busyText) {
    if (H.busy) return Promise.resolve(null);
    setBusy(true, button, busyText);
    return call(fn, args).then(function (res) {
      setBusy(false);
      App.showToast(res.success ? 'success' : 'error', res.message);
      return res;
    }, function (error) {
      setBusy(false);
      App.showToast('error', '画面の処理でエラーが発生しました：' + (error && error.message ? error.message : error));
      return null;
    });
  }

  function bind() {
    $('btnOpenHolidayWork').addEventListener('click', function () { openForm(false); });
    $('btnOpenHolidayWorkHistory').addEventListener('click', openHub);
    $('btnHwNew').addEventListener('click', function () { openForm(true); });
    $('btnHwFormBack').addEventListener('click', closeForm);
    $('btnHwFormClose').addEventListener('click', closeForm);
    ['hwStart', 'hwEnd'].forEach(function (id) {
      $(id).addEventListener('input', updateSpan);
      $(id).addEventListener('change', updateSpan);
    });
    $('hwCompType').addEventListener('change', updateCompDate);
    $('holidayWorkForm').addEventListener('submit', onSubmit);
    $('btnHwWithdrawOk').addEventListener('click', onWithdraw);
    $('btnHwWithdrawBack').addEventListener('click', function () { closeDialog('hwWithdrawModal'); });
    $('btnHwCancelOk').addEventListener('click', onCancelRequest);
    $('btnHwCancelBack').addEventListener('click', function () { closeDialog('hwCancelModal'); });
  }

  bind();
  load();
  window.LeafHolidayWork = { reload: load };
})();
</script>
