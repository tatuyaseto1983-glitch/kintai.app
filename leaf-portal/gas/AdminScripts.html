<script>
/* ============================================================
 * AdminScripts.html — 管理者画面の動き（ブラウザ側）
 *
 * ・データは getAdminDashboard() で取得します。サーバーが requireAdmin() で管理者と確認した場合だけ
 *   データが返り、それ以外は「管理者権限がありません」を表示します（画面側の表示だけに頼らない）
 * ・承認・却下・日報確認・CSV・再計算は、既存のサーバー関数をそのまま呼びます（どれもサーバー側で権限確認あり）
 * ・操作中は管理者画面のボタンをすべて無効化し、「処理中...」を表示します（連打しても1回だけ）
 * ・検索・絞り込みはブラウザの中だけで行います（サーバーへの問い合わせなし）
 * ・表示する文字は textContent で入れています（HTMLとして解釈しないので安全）
 * ============================================================ */
(function () {
  'use strict';

  var App = window.LeafApp;
  var el = App.el;

  /** 管理者画面から呼んでよいサーバーの関数 */
  // 'getAdminEmployeeMonth' 以降は段階5（社内詳細月次・集計・出力。読み取りだけ）
  var ADMIN_FUNCTIONS = [
    'getAdminDashboard', 'approveCorrectionRequest', 'rejectCorrectionRequest', 'approveOvertimeRequest',
    'rejectOvertimeRequest', 'exportAdminAttendanceCsv', 'previewAttendanceRecalculation', 'applyAttendanceRecalculation',
    'approveHolidayWorkRequest', 'rejectHolidayWorkRequest', 'approveHolidayWorkCancellation', 'rejectHolidayWorkCancellation',
    'getAttendanceDetail', 'getAdminDayDetail',
    'approvePaidLeaveRequest', 'rejectPaidLeaveRequest', 'approvePaidLeaveCancellation', 'rejectPaidLeaveCancellation',
    'getAdminEmployeeMonth', 'exportAdminEmployeeMonthCsv', 'getAdminMonthlyAnalysis', 'exportAdminMonthlySummaryCsv', 'exportSharoushiDetailCsv',
    'exportSharoushiTimecardXlsx',
  ];
  var ALL_PARTS = ['admin', 'summary', 'daily', 'monthly', 'corrections', 'overtime', 'holidayWork', 'paidLeave', 'flex', 'restDays', 'reports'];

  var S = {
    loaded: false,  // 一度でも管理者データを表示できたか
    busy: false,    // 承認・却下などの処理中
    mode: 'daily',  // 'daily' または 'monthly'
    date: '',
    month: '',
    data: {},
    seq: 0,         // 取得の順番（古い結果が後から届いても上書きしない）
    confirmAction: null,
    openDetail: {},  // 日別一覧で開いている行（勤怠ID → 取得した勤務区間）
  };

  function $(id) { return document.getElementById(id); }
  function call(fn, args) { return App.callAllowed(ADMIN_FUNCTIONS, fn, args); }

  // ============================================================ 取得

  function open() {
    if (!S.loaded) {
      $('adminLoading').hidden = false;
      $('adminContent').hidden = true;
      $('adminDenied').hidden = true;
    }
    return load(ALL_PARTS);
  }

  function load(parts) {
    var seq = ++S.seq;
    return call('getAdminDashboard', [{ date: S.date, month: S.month, parts: parts }]).then(function (res) {
      if (seq !== S.seq) return res; // もっと新しい取得がある
      $('adminLoading').hidden = true;
      if (!res.success) {
        if (/管理者権限がありません|管理者のみ/.test(res.message) || !S.loaded) showDenied(res.message);
        App.showToast('error', /管理者/.test(res.message) ? '管理者権限がありません' : 'データ取得に失敗しました：' + res.message);
        return res;
      }
      apply(res.data || {});
      return res;
    });
  }

  /** 管理者と確認できなかったときは、表示中のデータもすべて消す */
  function showDenied(message) {
    S.loaded = false;
    S.data = {};
    ['admTableBody', 'admCorrections', 'admOvertime', 'admHolidayWork', 'admFlexBody', 'admRestList', 'admReports', 'summaryCards'].forEach(function (id) { $(id).textContent = ''; });
    $('adminContent').hidden = true;
    $('adminDenied').hidden = false;
    var denied = /管理者権限がありません|管理者のみ/.test(message);
    $('adminDeniedTitle').textContent = denied ? '管理者権限がありません' : 'データ取得に失敗しました';
    $('adminDeniedDetail').textContent = message;
  }

  function apply(d) {
    S.loaded = true;
    $('adminDenied').hidden = true;
    $('adminContent').hidden = false;
    if (d.date) { S.date = d.date; $('admDate').value = d.date; }
    if (d.month) { S.month = d.month; $('admMonth').value = d.month; }
    Object.keys(d).forEach(function (k) { S.data[k] = d[k]; });
    if (d.admin) {
      $('adminName').textContent = d.admin.name;
      $('adminDept').textContent = d.admin.department ? '（' + d.admin.department + '）' : '';
    }
    if (d.summary) renderSummary();
    if (d.daily) S.openDetail = {}; // 取り直したら開いていた明細は閉じる（古い内容を出さない）
    if (d.daily || d.monthly) renderTable();
    if (d.corrections) renderCorrections();
    if (d.overtime) renderOvertime();
    if (d.holidayWork) renderHolidayWork();
    if (d.paidLeave) renderPaidLeave();
    if (d.flex) renderFlex();
    if (d.restDays) renderRestDays();
    if (d.reports) renderReports();
    var now = new Date();
    $('adminUpdatedAt').textContent = '更新 ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  // ============================================================ サマリー

  function renderSummary() {
    var s = S.data.summary;
    $('summaryDate').textContent = App.formatDateShort(s.date) + ' 時点';
    var cards = [
      ['本日出勤', s.present, '名', 'green', ''],
      ['在宅', s.remote, '名', 'green', ''],
      ['勤務中', s.working, '名', 'green', ''],
      ['中断中', s.onBreak, '名', s.onBreak ? 'orange' : 'gray', ''],
      ['退勤済み', s.finished, '名', 'gray', ''],
      ['未出勤', s.notStarted, '名', 'gray', ''],
      // この2つは「今日」ではなく今月（月初〜今日）の集計
      ['今月の打刻漏れ', s.missingPunchStaff, '名', s.missingPunchStaff ? 'red' : 'gray', s.missingPunchRecords + '件の記録'],
      ['今月の残業要確認', s.overtimeNeedsCheck, '件', s.overtimeNeedsCheck ? 'red' : 'gray', App.formatDateShort(s.monthFrom) + '〜今日'],
      ['設定変更後に未再計算', s.recalcStaleRecords || 0, '件', s.recalcStaleRecords ? 'red' : 'gray', '［再計算のプレビュー］で確認'],
      ['修正申請待ち', s.pendingCorrections, '件', s.pendingCorrections ? 'orange' : 'gray', ''],
      ['残業申請待ち', s.pendingOvertime, '件', s.pendingOvertime ? 'orange' : 'gray', ''],
      ['休日出勤申請待ち', s.pendingHolidayWork || 0, '件', s.pendingHolidayWork ? 'orange' : 'gray', '取消申請を含む'],
      ['有給申請待ち', s.pendingPaidLeave || 0, '件', s.pendingPaidLeave ? 'orange' : 'gray', '取消申請を含む'],
    ];
    var box = $('summaryCards');
    box.textContent = '';
    cards.forEach(function (c) {
      var card = el('div', 'summary-card tone-' + c[3]);
      card.appendChild(el('div', 'label', c[0]));
      var v = el('div', 'value', c[1]);
      v.appendChild(el('span', 'unit', c[2]));
      card.appendChild(v);
      if (c[4]) card.appendChild(el('div', 'note', c[4]));
      box.appendChild(card);
    });
  }

  // ============================================================ 一覧（日別・月別）

  function filters() {
    return {
      q: $('admSearch').value.trim().toLowerCase(),
      workType: $('admWorkType').value,
      workStyle: $('admWorkStyle').value,
      status: $('admStatus').value,
      alertOnly: $('admNeedsCheck').checked,
    };
  }

  function matchesCommon(row, f) {
    if (f.q && (row.name + ' ' + (row.department || '')).toLowerCase().indexOf(f.q) === -1) return false;
    if (f.workType && row.workType !== f.workType) return false;
    return true;
  }

  function statusBadge(status) {
    var cls = status === '勤務中' ? 'badge-working' : status === '中断中' ? 'badge-break' : status === '退勤済み' ? 'badge-finished' : 'badge-notstarted';
    return el('span', 'badge ' + cls, status || '—');
  }

  function requestBadge(status) {
    var cls = status === '承認待ち' ? 'badge-pending' : status === '承認済み' ? 'badge-ok' : status === '却下' ? 'badge-ng' : 'badge-notstarted';
    return el('span', 'badge ' + cls, status);
  }

  function setHead(columns) {
    var head = $('admTableHead');
    head.textContent = '';
    var tr = document.createElement('tr');
    columns.forEach(function (c, i) { tr.appendChild(el('th', i === 0 ? 'sticky-col' : '', c)); });
    head.appendChild(tr);
  }

  function td(text, className) { return el('td', className || '', text === '' || text === null || text === undefined ? '—' : text); }

  function renderTable() {
    var f = filters();
    var body = $('admTableBody');
    body.textContent = '';
    var shown = 0;
    var total = 0;
    if (S.mode === 'daily') {
      var daily = S.data.daily;
      $('admTableTitle').textContent = '全スタッフ勤怠（日別：' + (daily ? App.formatDateShort(daily.date) : '') + '）';
      setHead(['氏名', '部署', '勤務区分', '区分', '勤務場所', '直行・直帰・現場', '勤務区間', '出勤', '退勤', '中断合計', '自動休憩', '実働', '遅刻', '早退', '社内超過', '残業申請', '要確認', '打刻修正', '状態']);
      var rows = daily ? daily.rows : [];
      total = rows.length;
      rows.forEach(function (r) {
        var alert = r.needsCheck === '要確認' || (r.issues && r.issues.length) || (r.day && r.day.checks.length) || r.recalcStale;
        if (!matchesCommon(r, f)) return;
        if (f.workStyle && r.workStyle !== f.workStyle && (r.workStyleCategory || '').split('＋').indexOf(f.workStyle) === -1) return;
        if (f.status && r.status !== f.status) return;
        if (f.alertOnly && !alert) return;
        shown += 1;
        var tr = document.createElement('tr');
        if (alert) tr.className = 'row-alert';
        tr.appendChild(td(r.name, 'sticky-col'));
        tr.appendChild(td(r.department, 'left'));
        tr.appendChild(td(r.workType));
        tr.appendChild(dayBadgesCell(r.day)); // 通常・休出・法休出・有給・午前休・午後休・在宅・要確認（シフト・申請から）
        tr.appendChild(td(r.workPlace || '')); // 会社＋在宅 など（勤務場所だけ。現場・直行直帰は次の列）
        tr.appendChild(td([r.direct ? '直行' : '', r.directReturn ? '直帰' : '', r.sites && r.sites.length ? '現場：' + r.sites.join('・') : '']
          .filter(function (x) { return x; }).join('／') || '—', 'left'));
        tr.appendChild(segmentCell(r));
        tr.appendChild(td(r.clockIn));
        tr.appendChild(td(r.clockOut));
        tr.appendChild(td(r.breakTotal));
        tr.appendChild(td(r.autoBreak));
        tr.appendChild(td(r.workTime));
        tr.appendChild(td(r.late));
        tr.appendChild(td(r.earlyLeave));
        var excess = td(r.internalExcess, r.needsCheck === '要確認' ? 'cell-alert' : '');
        if (r.needsCheck === '要確認') excess.appendChild(el('span', 'cell-sub', '30分以上・' + (r.preOvertimeRequest === '承認待ち' ? '申請は承認待ち' : r.preOvertimeRequest === '却下' ? '申請は却下' : '事前申請なし')));
        tr.appendChild(excess);
        var req = el('td');
        if (r.preOvertimeRequest && r.preOvertimeRequest !== '不要' && r.preOvertimeRequest !== 'なし') req.appendChild(requestBadge(r.preOvertimeRequest));
        else req.textContent = r.preOvertimeRequest || '—';
        tr.appendChild(req);
        var check = el('td');
        if (r.needsCheck === '要確認') check.appendChild(el('span', 'badge badge-ng', '要確認'));
        else check.textContent = '—';
        tr.appendChild(check);
        var cor = el('td');
        if (r.correctionStatus) cor.appendChild(el('span', 'badge ' + (r.correctionStatus === '申請中' ? 'badge-pending' : r.correctionStatus === '却下' ? 'badge-ng' : 'badge-ok'), r.correctionStatus));
        else cor.textContent = '—';
        tr.appendChild(cor);
        var st = el('td');
        var badges = el('div', 'badges');
        badges.appendChild(statusBadge(r.status));
        (r.issues || []).forEach(function (issue) {
          var b = el('span', 'badge badge-ng', '打刻漏れ：' + issue);
          badges.appendChild(b);
        });
        if (r.recalcStale) {
          // 表示している値は保存値のまま。今の設定で計算すると変わる（再計算のプレビューで確認してから再計算する）
          var stale = el('span', 'badge badge-ng recalc-stale', '設定変更後に未再計算');
          stale.title = r.recalcStale.text;
          badges.appendChild(stale);
          badges.appendChild(el('span', 'recalc-stale-text', r.recalcStale.text));
        }
        st.appendChild(badges);
        tr.appendChild(st);
        body.appendChild(tr);
        if (S.openDetail[detailKey(r)]) body.appendChild(detailRow(S.openDetail[detailKey(r)]));
      });
    } else {
      var monthly = S.data.monthly;
      // 「2026年9月分 対象期間：2026/08/21〜2026/09/20」（締め日の設定による期間をそのまま表示）
      $('admTableTitle').textContent = '全スタッフ勤怠（月別：' + (monthly ? (monthly.periodText || App.formatMonth(monthly.month) + '　' + App.formatDateShort(monthly.from) + '〜' + App.formatDateShort(monthly.to)) : '') + '）';
      setHead(['氏名', '部署', '勤務区分', '出勤日数', '実働合計', '遅刻合計', '早退合計', '社内超過合計', '打刻漏れ', '修正申請', '残業要確認', '月所定', '実働（フレックス）', '残り', '超過', '業務走行距離', '交通費（通勤以外）',
      ].concat(S.data.shiftEnabled
        ? ['休日出勤', '法定休日出勤', '有給（1日/午前/午後）', '有給時間', '在宅日数', '要確認（シフト・申請）']
        : ['休日出勤', '有給（1日/午前/午後）', '有給時間', '在宅日数', '要確認（申請）'])); // 法定休日出勤はシフト管理を使うときだけ
      var mrows = monthly ? monthly.rows : [];
      total = mrows.length;
      mrows.forEach(function (r) {
        var alert = r.missingPunchCount > 0 || r.needsCheckCount > 0 || (r.days && r.days.checkCount > 0);
        if (!matchesCommon(r, f)) return;
        if (f.alertOnly && !alert) return;
        shown += 1;
        var tr = document.createElement('tr');
        if (alert) tr.className = 'row-alert';
        var nameCell = td(r.name, 'sticky-col');
        var detailBtn = el('button', 'btn btn-outline btn-sm js-admin-action', '詳細');
        detailBtn.type = 'button';
        detailBtn.setAttribute('data-emp-month', r.employeeId);
        detailBtn.addEventListener('click', function () { openEmployeeMonth(r.employeeId, detailBtn); });
        nameCell.appendChild(document.createTextNode(' '));
        nameCell.appendChild(detailBtn);
        tr.appendChild(nameCell);
        tr.appendChild(td(r.department, 'left'));
        tr.appendChild(td(r.workType));
        tr.appendChild(td(r.workDays + '日'));
        tr.appendChild(td(App.trimHour(r.workTime)));
        tr.appendChild(td(r.lateCount ? App.trimHour(r.lateTotal) + '（' + r.lateCount + '回）' : '—'));
        tr.appendChild(td(r.earlyLeaveTotal === '00:00' ? '—' : App.trimHour(r.earlyLeaveTotal)));
        tr.appendChild(td(r.workType === 'フレックス' ? '対象外' : App.trimHour(r.internalExcessTotal)));
        tr.appendChild(td(r.missingPunchCount ? r.missingPunchCount + '件' : '—', r.missingPunchCount ? 'cell-alert' : ''));
        tr.appendChild(td(r.correctionCount ? r.correctionCount + '件' : '—'));
        tr.appendChild(td(r.needsCheckCount ? r.needsCheckCount + '件' : '—', r.needsCheckCount ? 'cell-alert' : ''));
        tr.appendChild(td(r.flex ? r.flex.scheduled : '—'));
        var fw = td(r.flex ? r.flex.worked : '—');
        if (r.flex && r.flex.paidLeave && r.flex.paidLeave !== '00:00') fw.appendChild(el('span', 'cell-sub', '有給 ' + App.trimHour(r.flex.paidLeave) + (r.flex.paidLeaveMode === '未確定' ? '（138時間への算入は未確定）' : r.flex.paidLeaveMode === '算入する' ? '（算入済み）' : '（算入しない）')));
        tr.appendChild(fw);
        tr.appendChild(td(r.flex ? r.flex.remaining : '—'));
        tr.appendChild(td(r.flex ? r.flex.excess : '—', r.flex && r.flex.excess !== '00:00' ? 'cell-alert' : ''));
        tr.appendChild(td(r.mileageKm ? r.mileageText : '—'));
        tr.appendChild(td(r.transportAmount ? r.transportAmountText : '—'));
        var dd = r.days || {};
        tr.appendChild(td(dd.holidayWorkDays ? dd.holidayWorkDays + '日・' + App.trimHour(dd.holidayWorkTime) : '—'));
        if (S.data.shiftEnabled) tr.appendChild(td(dd.legalHolidayWorkDays ? dd.legalHolidayWorkDays + '日・' + App.trimHour(dd.legalHolidayWorkTime) : '—'));
        tr.appendChild(td((dd.fullLeaveDays || dd.amLeaveDays || dd.pmLeaveDays) ? (dd.fullLeaveDays || 0) + '/' + (dd.amLeaveDays || 0) + '/' + (dd.pmLeaveDays || 0) : '—'));
        tr.appendChild(td(dd.leaveMinutes ? App.trimHour(dd.leaveTime) : '—'));
        tr.appendChild(td(dd.remoteDays ? dd.remoteDays + '日' : '—'));
        var chk = td(dd.checkCount ? dd.checkCount + '件' : '—', dd.checkCount ? 'cell-alert' : '');
        if (dd.checkCount) chk.title = dd.checks.map(function (c) { return App.formatDateShort(c.date) + ' ' + c.reason; }).join('\n');
        tr.appendChild(chk);
        body.appendChild(tr);
      });
    }
    if (!shown) {
      var empty = document.createElement('tr');
      var cell = el('td', 'empty', total ? '条件に合うスタッフはいません' : 'データがありません');
      cell.colSpan = 24;
      empty.appendChild(cell);
      body.appendChild(empty);
    }
    $('admTableCount').textContent = shown + '名 / ' + total + '名';
  }

  /** 1日の区分のバッジ（色は 休日系・有給系・要確認 だけ。理由はマウスを重ねると出る） */
  function dayBadgesCell(day) {
    var cell = el('td');
    if (!day || !day.badges.length) { cell.textContent = '—'; return cell; }
    var box = el('div', 'badges');
    day.badges.forEach(function (b) {
      var badge = el('span', 'badge ' + (b.tone === 'ng' ? 'badge-ng' : b.tone === 'holiday' ? 'badge-holiday' : b.tone === 'leave' ? 'badge-leave' : 'badge-notstarted'), b.text);
      if (b.tone === 'ng') badge.title = day.checks.join('\n');
      box.appendChild(badge);
    });
    if (day.checks.length) box.appendChild(el('span', 'cell-sub', day.checks.join('／')));
    cell.appendChild(box);
    return cell;
  }

  /** 勤務区間の数と「開く」ボタン（押すとその日の勤務区間と中断を下に表示） */
  /** 明細を開く単位（社員ID＋日付）。勤怠記録がない日（交通費だけの日）も開ける */
  function detailKey(r) { return r.employeeId + '|' + ((S.data.daily && S.data.daily.date) || r.date); }

  function segmentCell(r) {
    var cell = el('td');
    if (!r.employeeId) { cell.textContent = '—'; return cell; }
    var count = r.segmentCount || '';
    cell.appendChild(document.createTextNode(count ? count + '区間 ' : ''));
    var key = detailKey(r);
    var opened = !!S.openDetail[key];
    var btn = el('button', 'btn btn-ghost btn-sm', opened ? '閉じる' : '開く');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', opened ? 'true' : 'false');
    btn.setAttribute('data-detail', key);
    btn.addEventListener('click', function () { toggleDetail(key, btn); });
    cell.appendChild(btn);
    return cell;
  }

  function toggleDetail(key, button) {
    if (S.busy) return;
    if (S.openDetail[key]) {
      delete S.openDetail[key];
      renderTable();
      return;
    }
    button.disabled = true;
    button.textContent = '読み込み中...';
    var parts = key.split('|');
    call('getAdminDayDetail', [parts[0], parts[1]]).then(function (res) {
      if (!res.success) {
        App.showToast('error', res.message);
        button.disabled = false;
        button.textContent = '開く';
        return;
      }
      S.openDetail[key] = res.data;
      renderTable();
    });
  }

  /** 勤務区間と中断の明細の行 */
  function detailRow(detail) {
    var tr = el('tr', 'detail-row');
    var cell = el('td', 'left');
    cell.colSpan = 24;
    var box = el('div', 'segment-detail');
    // 操作の順番（勤務区間と中断を1本の時系列に）
    if (detail.events && detail.events.length) {
      box.appendChild(el('p', 'subhead', '操作の順番' + (detail.showSeconds ? '（テスト環境のため秒まで表示）' : '')));
      var ue = el('ul', 'timeline');
      detail.events.forEach(function (ev) {
        var li = el('li', 'timeline-item ' + (ev.kind === 'break' ? 'style-break' : ev.kind === 'end' ? 'style-end' : ev.style === '在宅' ? 'style-remote' : (ev.style === '現場' || ev.style === '外出') ? 'style-field' : 'style-office'));
        li.appendChild(el('span', 'timeline-time', ev.time));
        li.appendChild(document.createTextNode(' ' + ev.label));
        ue.appendChild(li);
      });
      box.appendChild(ue);
    }
    var dd = detail.detail || { segments: [], transports: [], car: { count: 0 } };
    // シフト・1日の区分・有給・要確認（勤務場所とは別の項目）
    if (detail.day) {
      var dayInfo = el('dl', 'record-list record-list-compact');
      var hw = detail.day.holidayWork;
      var leaveText = detail.day.leave ? detail.day.leave.type + ' ' + App.trimHour(formatHm(detail.day.leave.minutes)) + '（実働とは別）' : 'なし';
      var checkText = detail.day.checks.length ? detail.day.checks.join('／') : 'なし';
      var items = S.data && S.data.shiftEnabled
        ? [['シフト', detail.day.shiftType], ['区分', detail.day.kind || (detail.day.leave ? '有給' : 'なし')],
          ['休日出勤', hw ? hw.kind + ' ' + App.trimHour(formatHm(hw.minutes)) + (hw.approved ? '（承認済み申請あり）' : '（承認済み申請なし）') : 'なし'],
          ['有給', leaveText], ['要確認（シフト・申請）', checkText]]
        : [['休日出勤', hw ? '承認済みの休日出勤 ' + App.trimHour(formatHm(hw.minutes)) + '（遅刻・早退・社内超過は判定しない）' : 'なし'],
          ['有給', leaveText], ['要確認（申請）', checkText]]; // シフト管理を使わない間は、シフト・休日／法定休日の区別を出さない
      items.forEach(function (x) {
        dayInfo.appendChild(el('dt', '', x[0]));
        dayInfo.appendChild(el('dd', x[0].indexOf('要確認') === 0 && detail.day.checks.length ? 'cell-alert' : '', x[1]));

    if (!detail.record) box.appendChild(el('p', 'muted', 'この日は勤怠記録がありません。'));
    box.appendChild(el('p', 'subhead', '勤務区間' + (detail.segments.length && detail.segments[0].virtual ? '（以前の記録のため、出勤〜退勤を1区間として表示）' : '')));
    var ul = el('ul', 'timeline');
    detail.segments.forEach(function (s, i) {
      var a = dd.segments[i] || {};
      var attrs = [a.direct ? '直行' : '', a.directReturn ? '直帰' : '', a.site ? '現場：' + a.site : '', a.note ? '備考：' + a.note : ''].filter(function (x) { return x; });
      ul.appendChild(el('li', 'timeline-item style-' + (s.style === '在宅' ? 'remote' : (s.style === '現場' || s.style === '外出') ? 'field' : 'office'),
        '区間' + s.number + '　' + (a.place || (s.style === '出社' ? '会社' : s.style)) + '　' + s.start + '〜' + (s.end || '勤務中') + (s.workTime ? '（区間の実働 ' + App.trimHour(s.workTime) + '）' : '') +
        (attrs.length ? '　' + attrs.join('／') : '')));
    });
    box.appendChild(ul);
    // 日の情報・自家用車・交通費（交通費明細から。削除済みは出さない）
    box.appendChild(el('p', 'subhead', 'この日の情報'));
    // 勤務場所（会社・在宅）と、付帯情報（直行・直帰・現場）・日の属性は分けて表示する
    var place = el('dl', 'record-list record-list-compact');
    [['勤務場所', dd.workPlace || '—'], ['直行', dd.direct ? 'あり' : 'なし'], ['直帰', dd.directReturn ? 'あり' : 'なし'],
      ['現場', dd.sites && dd.sites.length ? dd.sites.join('・') : 'なし'], ['出張', dd.businessTrip ? 'あり' : 'なし'],
      ['日備考', dd.dayNote || 'なし'], ['自家用車の業務走行距離', dd.car && dd.car.count ? dd.car.kmText : 'なし']].forEach(function (x) {
      place.appendChild(el('dt', '', x[0]));
      place.appendChild(el('dd', '', x[1]));
    });
    box.appendChild(place);
    box.appendChild(el('p', 'subhead', '交通費' + (dd.transportTotals ? '（' + dd.transportTotals.count + '件・' + dd.transportTotals.amountText + '・' + dd.transportTotals.kmText + '）' : '')));
    var ut = el('ul', 'timeline');
    if (!dd.transports.length) ut.appendChild(el('li', 'muted', 'なし'));
    dd.transports.forEach(function (t) {
      ut.appendChild(el('li', 'timeline-item', [t.mode, (t.from || t.to) ? (t.from || '') + '→' + (t.to || '') : '', t.purpose,
        t.km ? t.km + 'km' : '', t.amount !== '' ? Number(t.amount).toLocaleString('ja-JP') + '円' : '', t.privateCar && t.mode !== '自家用車' ? '自家用車' : '', t.note]
        .filter(function (x) { return x; }).join('　')));
    });
    box.appendChild(ut);
    box.appendChild(el('p', 'subhead', '中断'));
    var ub = el('ul', 'timeline');
    if (!detail.breaks.length) ub.appendChild(el('li', 'muted', 'なし'));
    detail.breaks.forEach(function (b) {
      ub.appendChild(el('li', 'timeline-item style-break', b.start + '〜' + (b.end || '中断中') + (b.minutes ? '（' + App.trimHour(b.minutes) + '）' : '') + (b.reason ? '　' + b.reason : '')));
    });
    box.appendChild(ub);
    var r = detail.record || {};
    if (r.officeTime || r.remoteTime) {
      box.appendChild(el('p', 'card-note', '会社 ' + App.trimHour(r.officeTime || '00:00') + '／在宅 ' + App.trimHour(r.remoteTime || '00:00') +
        '／自動休憩 ' + App.trimHour(r.autoBreak || '00:00') + '／実働 ' + App.trimHour(r.workTime || '00:00') +
        '（会社・在宅は中断を除いた時間。合計から自動休憩を引いたものが実働）'));
    }
    cell.appendChild(box);
    tr.appendChild(cell);
    return tr;
  }

  function formatHm(minutes) {
    var m = Math.max(0, Math.round(minutes || 0));
    return (m < 600 ? '0' : '') + Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60);
  }

  function setMode(mode) {
    S.mode = mode === 'monthly' ? 'monthly' : 'daily';
    var tabs = document.querySelectorAll('#adminView .tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-mode') === S.mode ? 'true' : 'false');
    var controls = document.querySelectorAll('#adminView [data-for-mode]');
    for (var j = 0; j < controls.length; j++) controls[j].hidden = controls[j].getAttribute('data-for-mode') !== S.mode;
    renderTable();
  }

  /** 申請の「今のシフト」と、承認できないときの注意（申請時のシフトと違えば両方出す） */
  function shiftLine(current, atRequest, blocked, okWhat) {
    var line = el('div', 'request-shift');
    if (!current) { line.hidden = true; return line; } // シフト管理を使わない間は出さない
    line.appendChild(el('span', 'badge ' + (current === '未登録' || current === 'シフト重複' || current === 'シフト不備' ? 'badge-ng' : 'badge-notstarted'), 'シフト：' + (current || '—')));
    if (atRequest && atRequest !== current) line.appendChild(el('span', 'section-sub', '　申請時：' + atRequest));
    if (blocked) line.appendChild(el('span', 'cell-alert', '　承認できません（' + okWhat + 'の日だけ承認できます）'));
    return line;
  }

  function renderRequestList(container, list, showDone, build) {
    container.textContent = '';

      container.appendChild(el('p', 'empty', showDone ? '申請はありません' : '承認待ちの申請はありません'));
      return;
    }
    items.forEach(function (r) { container.appendChild(build(r)); });

  function requestBox(r) {
    var box = el('div', 'request' + (r.status === '承認待ち' ? ' is-pending' : ''));
    var head = el('div', 'request-head');
    var name = el('span', 'request-name', r.name);
    if (r.department) name.appendChild(el('span', 'section-sub', '　' + r.department));
    head.appendChild(name);
    head.appendChild(requestBadge(r.status));
    box.appendChild(head);
    return box;

  function requestActions(onApprove, onReject, approveLabel, rejectLabel) {
    var row = el('div', 'request-actions');
    var reject = el('button', 'btn btn-danger btn-sm js-admin-action', rejectLabel || '却下');
    reject.type = 'button';
    reject.addEventListener('click', onReject);
    var approve = el('button', 'btn btn-primary btn-sm js-admin-action', approveLabel || '承認');
    approve.type = 'button';

  function renderReports() {
    var rep = S.data.reports;
    $('admReportDate').textContent = App.formatDateShort(rep.date);
    $('admReportCount').textContent = '提出済み ' + rep.submittedCount + '名／未提出 ' + rep.notSubmittedCount + '名（うち下書きあり ' + (rep.draftOnlyCount || 0) + '名）／対象外 ' + (rep.noneCount || 0) + '名';
    if (!rep.reportMissingFrom) $('admReportCount').textContent += '　※ 設定「日報_未提出判定開始日」が空欄のため、未提出は判定していません';
    else $('admReportCount').textContent += '　（未提出の判定は ' + App.formatDateShort(rep.reportMissingFrom) + ' から）';
    renderReportMonthly(rep.monthly);
    var filter = $('admReportFilter').value;
    var box = $('admReports');
    box.textContent = '';
    var rows = rep.rows.filter(function (r) {
      if (filter === 'submitted') return r.state === 'submitted';

      return true;
    });
    if (!rows.length) { box.appendChild(el('p', 'empty', '該当する日報はありません')); return; }
    rows.forEach(function (r) {
      // 下書きはサーバーが「未提出」として返す（内容は管理者にも返さない）
      var item = el('div', 'report report-row' + (r.state === 'missing' || r.state === 'draft' ? ' not-submitted' : ''));
      var left = el('div', 'report-row-main');
      var name = el('span', 'report-row-name', r.name);
      name.appendChild(el('span', 'section-sub', '　' + [r.department, r.workStyle].filter(Boolean).join('・')));
      left.appendChild(name);
      if (r.submitted) {
        var meta = '接客 ' + (r.customerCount || 0) + '件　コメント ' + (r.commentCount || 0) + '件';
        if (r.targetCount !== undefined) meta += '　' + r.confirmedCount + ' / ' + r.targetCount + '人 確認済み';
        if (r.pendingNames && r.pendingNames.length) meta += '　未確認：' + r.pendingNames.join('、');
        if (r.legacy) meta += '　以前の日報（本人・管理者のみ閲覧）';
        if (r.version > 1) meta += '　修正あり（バージョン' + r.version + '）';
        left.appendChild(el('span', 'report-row-meta', meta));
      }
      item.appendChild(left);
      var right = el('div', 'report-row-actions');

      right.appendChild(el('span', 'badge ' + badgeClass, r.status));

  /** 1日の明細（勤務区間・中断・交通費）を、その行の下に開く／閉じる */
  function toggleEmpDayDetail(tr, d, colSpan) {
    var next = tr.nextSibling;
    if (next && next.classList && next.classList.contains('emp-day-detail')) { next.remove(); return; }
    var row = el('tr', 'emp-day-detail');
    var cell = el('td', 'left');
    cell.colSpan = colSpan;
    var ul = el('ul', 'plain-list');
    d.segments.forEach(function (s, i) {
      var extra = [s.direct ? '直行' : '', s.directReturn ? '直帰' : '', s.site ? '現場：' + s.site : '', s.note ? '備考：' + s.note : ''].filter(Boolean).join('／');
      ul.appendChild(el('li', '', '区間' + (i + 1) + '　' + s.place + '　' + s.start + '〜' + (s.end || '（勤務中）') + (extra ? '　' + extra : '')));
    });
    d.interruptions.forEach(function (b) { ul.appendChild(el('li', '', '中断（私用の中抜け）　' + b.start + '〜' + b.end)); });
    d.transports.forEach(function (t) {
      ul.appendChild(el('li', '', '交通費　' + t.mode + (t.from || t.to ? '　' + t.from + '→' + t.to : '') + (t.purpose ? '　' + t.purpose : '') +
        (t.amount ? '　' + Number(t.amount).toLocaleString('ja-JP') + '円' : '') + (t.km ? '　' + t.km + 'km' : '')));
    });
    if (d.dayNote) ul.appendChild(el('li', '', '日備考　' + d.dayNote));
    cell.appendChild(ul);
    row.appendChild(cell);
    tr.parentNode.insertBefore(row, tr.nextSibling);
  }

  // ============================================================ 操作（承認・却下・CSV・再計算）

  /** 操作の共通処理：ボタン無効化 →「処理中...」→ 通知 → 一覧を取り直す → ボタンを戻す */
  function adminAction(button, fn, args) {
    if (S.busy) return Promise.resolve(null);
    setBusy(true, button);
    return call(fn, args).then(function (res) {
      App.showToast(res.success ? 'success' : 'error', res.success ? res.message : (/管理者/.test(res.message) ? '管理者権限がありません' : res.message));
      if (!res.success && /管理者権限がありません|管理者のみ/.test(res.message)) { showDenied(res.message); return res; }
      return load(ALL_PARTS.filter(function (p) { return p !== 'admin'; })).then(function () { return res; });
    }).then(function (res) {
      setBusy(false);
      return res;
    }, function (error) {
      setBusy(false);
      App.showToast('error', '画面の処理でエラーが発生しました：' + (error && error.message ? error.message : error));
      return null;
    });
  }

  function setBusy(isBusy, button) {
    S.busy = isBusy;
    document.body.classList.toggle('is-busy', isBusy);
    var buttons = document.querySelectorAll('#adminView [data-admin-label], #adminView .js-admin-action, #adminConfirmModal [data-admin-label]');
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (isBusy) {
        if (!b.hasAttribute('data-original-label')) b.setAttribute('data-original-label', b.textContent);
        b.disabled = true;
        if (b === button) { b.classList.add('is-busy'); b.textContent = '処理中...'; }
      } else {
        b.classList.remove('is-busy');
        if (b.hasAttribute('data-original-label')) { b.textContent = b.getAttribute('data-original-label'); b.removeAttribute('data-original-label'); }
        b.disabled = false;
      }
    }
    $('btnToStaff').disabled = isBusy;
  }

  /** 確認画面を出してから実行する */
  function confirmAction(opts) {
    if (S.busy) return;
    S.confirmAction = opts;
    $('adminConfirmTitle').textContent = opts.title;
    $('adminConfirmText').textContent = opts.text;
    $('adminConfirmReasonRow').hidden = !opts.needReason;
    $('adminConfirmReason').value = '';
    var ok = $('btnAdminConfirmOk');
    ok.textContent = opts.okLabel;
    ok.className = 'btn ' + (opts.okClass || 'btn-primary');
    App.openModal('adminConfirmModal');
    (opts.needReason ? $('adminConfirmReason') : ok).focus();
  }

  function onConfirmOk() {
    var opts = S.confirmAction;
    if (!opts || S.busy) return;
    var reason = $('adminConfirmReason').value.trim();
    if (opts.needReason && !reason) { App.showToast('warn', '却下理由を入力してください'); return; }
    S.confirmAction = null;
    App.closeModal('adminConfirmModal');
    opts.run(opts.button || null, reason);
  }

  function exportCsv(type, button) {
    if (S.busy) return;
    setBusy(true, button);
    call('exportAdminAttendanceCsv', [{ type: type, date: S.date, month: S.month }]).then(function (res) {
      setBusy(false);
      if (!res.success) {
        App.showToast('error', /管理者/.test(res.message) ? '管理者権限がありません' : res.message);
        return;
      }
      if (downloadText(res.data.fileName, res.data.csv)) App.showToast('success', 'CSVを作成しました（' + res.data.fileName + '）');
      else App.showToast('error', 'CSVのダウンロードに失敗しました。ブラウザの設定を確認してください');
    });
  }

  /** 文字列をファイルとして保存する（CSV は先頭の BOM ごと UTF-8 で保存） */
  function downloadText(fileName, text) {
    try {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.target = '_self'; // 画面の <base target="_top"> で別の画面へ移動しないように
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** base64 のデータをそのままのバイト列でファイルとして保存する（.xlsx など） */
  function downloadBase64(fileName, base64, mimeType) {
    try {
      var binary = atob(base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/octet-stream' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.target = '_self';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) {
      return false;
    }
  }

  // ============================================================ 再計算（必ずプレビューしてから）

  /** 再計算のプレビューを開く（期間は今の20日締め期間、社員は全員から選べる） */
  function openRecalc() {
    var panel = $('admRecalc');
    panel.hidden = false;
    var s = S.data && S.data.summary;
    if (!$('admRecalcFrom').value && s) $('admRecalcFrom').value = s.monthFrom;
    if (!$('admRecalcTo').value && s) $('admRecalcTo').value = s.monthTo;
    var select = $('admRecalcStaff');
    var current = select.value;
    var seen = {};
    while (select.options.length > 1) select.remove(1);
    [].concat((S.data && S.data.monthly && S.data.monthly.rows) || [], (S.data && S.data.daily && S.data.daily.rows) || []).forEach(function (r) {
      if (!r.employeeId || seen[r.employeeId]) return;
      seen[r.employeeId] = true;
      var o = document.createElement('option');
      o.value = r.employeeId;
      o.textContent = r.name;
      select.appendChild(o);
    });
    select.value = current;
    resetRecalcPreview('期間と社員を選んで［変わる内容を確認］を押してください。');
    panel.scrollIntoView({ block: 'start' });
  }

  function resetRecalcPreview(message) {
    S.recalcPreview = null;
    $('admRecalcSummary').textContent = message || '';
    $('admRecalcNotes').textContent = '';
    $('admRecalcBody').textContent = '';
    $('admRecalcTableWrap').hidden = true;
    $('btnRecalcApply').disabled = true;
  }

  function recalcQuery() {
    return { from: $('admRecalcFrom').value, to: $('admRecalcTo').value, employeeId: $('admRecalcStaff').value };
  }

  function beforeAfter(v) {
    var cell = el('td', v.changed ? 'cell-alert' : '', v.changed ? v.before + ' → ' + v.after : v.before);
    return cell;
  }

  function onRecalcPreview() {
    if (S.busy) return;
    var button = $('btnRecalcPreview');
    setBusy(true, button);
    call('previewAttendanceRecalculation', [recalcQuery()]).then(function (res) {
      setBusy(false);
      if (!res.success) { resetRecalcPreview(''); App.showToast('error', /管理者/.test(res.message) ? '管理者権限がありません' : res.message); return; }
      var d = res.data;
      S.recalcPreview = d;
      $('admRecalcSummary').textContent = res.message;
      var notes = $('admRecalcNotes');
      notes.textContent = '';
      (d.notes || []).forEach(function (n) { notes.appendChild(el('li', '', n)); });
      var body = $('admRecalcBody');
      body.textContent = '';
      d.rows.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.setAttribute('data-attendance-id', r.attendanceId);
        tr.appendChild(td(r.name, 'left'));
        tr.appendChild(td(App.formatDateShort(r.date))); // 「6/1（月）」（曜日つき）
        tr.appendChild(beforeAfter(r.autoBreak));
        tr.appendChild(beforeAfter(r.workTime));
        tr.appendChild(td(r.others.map(function (o) { return o.label + '：' + o.before + ' → ' + o.after; }).join('\n') || '—', 'left pre-line'));
        tr.appendChild(td(r.reasons.join('\n'), 'left pre-line'));
        body.appendChild(tr);
      });
      $('admRecalcTableWrap').hidden = !d.rows.length;
      $('btnRecalcApply').disabled = !d.rows.length;
      $('btnRecalcApply').textContent = d.rows.length ? 'この内容で再計算する（' + d.rows.length + '件）' : 'この内容で再計算する';
    });
  }

  function onRecalcApply() {
    var d = S.recalcPreview;
    if (!d || !d.rows.length || S.busy) return;
    var button = $('btnRecalcApply');
    confirmAction({
      title: 'プレビューの ' + d.rows.length + '件を再計算しますか？',
      text: d.from + '〜' + d.to + (d.employeeName ? '（' + d.employeeName + '）' : '（全員）') + ' のうち、プレビューに出た ' + d.rows.length + '件の勤怠記録を、表示どおりの値に書き換えます。\nプレビューのあとで記録や設定が変わっていた場合は、何も書き換えずに止まります。',
      okLabel: '再計算する', okClass: 'btn-dark', button: button,
      run: function () {
        var items = d.rows.map(function (r) { return { attendanceId: r.attendanceId, fingerprint: r.fingerprint }; });
        return adminAction(button, 'applyAttendanceRecalculation', [{ from: d.from, to: d.to, employeeId: d.employeeId, items: items }]).then(function (res) {
          if (res && res.success) onRecalcPreview(); // 書き換えたあとの状態（変わる記録 0件）を見せる
          else resetRecalcPreview(res ? res.message : '');
        });
      },
    });
  }

  // ============================================================ 起動

  function bind() {
    var tabs = document.querySelectorAll('#adminView .tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function (e) { setMode(e.currentTarget.getAttribute('data-mode')); });
    }
    $('admDate').addEventListener('change', function () {
      if (!$('admDate').value) return;
      S.date = $('admDate').value;
      load(['daily', 'flex', 'restDays', 'reports']);
    });
    $('admMonth').addEventListener('change', function () {
      if (!$('admMonth').value) return;
      S.month = $('admMonth').value;
      load(['monthly', 'flex']);
    });
    ['admSearch'].forEach(function (id) { $(id).addEventListener('input', renderTable); });
    ['admWorkType', 'admWorkStyle', 'admStatus', 'admNeedsCheck'].forEach(function (id) { $(id).addEventListener('change', renderTable); });
    $('corShowDone').addEventListener('change', function () { if (S.data.corrections) renderCorrections(); });
    $('otShowDone').addEventListener('change', function () { if (S.data.overtime) renderOvertime(); });
    $('hwShowDone').addEventListener('change', function () { if (S.data.holidayWork) renderHolidayWork(); });
    $('plShowDone').addEventListener('change', function () { if (S.data.paidLeave) renderPaidLeave(); });
    $('admReportFilter').addEventListener('change', function () { if (S.data.reports) renderReports(); });
    $('btnAdminReload').addEventListener('click', function () {
      if (S.busy) return;
      setBusy(true, $('btnAdminReload'));
      load(ALL_PARTS).then(function () { setBusy(false); }, function () { setBusy(false); });
    });
    $('btnCsvDaily').addEventListener('click', function () { exportCsv('daily', $('btnCsvDaily')); });
    $('btnCsvMonthly').addEventListener('click', function () { exportCsv('monthly', $('btnCsvMonthly')); });
    $('btnLoadAnalysis').addEventListener('click', function () { loadAnalysis($('btnLoadAnalysis')); });
    $('admCheckFilter').addEventListener('change', renderAnalysis);
    $('btnCsvSummary').addEventListener('click', function () { exportNamedCsv('exportAdminMonthlySummaryCsv', [S.month], $('btnCsvSummary')); });
    $('btnCsvSharoushi').addEventListener('click', function () { exportNamedCsv('exportSharoushiDetailCsv', [S.month], $('btnCsvSharoushi')); });
    $('btnXlsxSharoushi').addEventListener('click', function () { exportXlsx($('btnXlsxSharoushi')); });
    $('btnEmpMonthClose').addEventListener('click', function () { $('admEmpMonth').hidden = true; });
    $('btnEmpMonthCsv').addEventListener('click', function () {
      if (S.empMonth) exportNamedCsv('exportAdminEmployeeMonthCsv', [S.empMonth.employee.employeeId, S.empMonth.month], $('btnEmpMonthCsv'));
    });
    $('btnRecalcOpen').addEventListener('click', openRecalc);
    $('btnRecalcPreview').addEventListener('click', onRecalcPreview);
    $('btnRecalcApply').addEventListener('click', onRecalcApply);
    $('btnRecalcClose').addEventListener('click', function () { $('admRecalc').hidden = true; resetRecalcPreview(''); });
    ['admRecalcFrom', 'admRecalcTo', 'admRecalcStaff'].forEach(function (id) {
      $(id).addEventListener('change', function () { resetRecalcPreview('条件を変えました。［変わる内容を確認］を押してください。'); });
    });
    $('btnAdminConfirmOk').addEventListener('click', onConfirmOk);
    $('btnAdminConfirmCancel').addEventListener('click', function () { S.confirmAction = null; App.closeModal('adminConfirmModal'); });
  }

  bind();
  window.LeafAdmin = { open: open };
})();
</script>
