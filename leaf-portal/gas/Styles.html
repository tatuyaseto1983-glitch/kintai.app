<style>
/* ============================================================
 * Styles.html — スタッフ画面・管理者画面の見た目
 *
 * 【色・フォントを変えるときは、下の :root の「ブランド」の値だけを直してください】
 *   --brand-*  … 会社の色・文字・背景・フォント・角丸・影（画面全体の雰囲気）
 *   --state-*  … 意味のある色（勤務中・中断中・承認待ち・却下・エラーなど）。ブランドを変えても変えない
 * その下の --green などは、昔からの名前をそのまま使えるようにするための「別名」です。
 * ============================================================ */
:root {
  /* ---------- ブランド（ここを変えると画面全体の雰囲気が変わる） ----------
   * Leaf 公式HPのトーン（白〜生成り・ベージュ・チャコール・深緑）に寄せた独自の配色です。
   * 公式HPのCSSから取得した値ではありません（取得できなかったため）。 */
  --brand-primary: #3F5E4B;        /* アクセント：落ち着いた深緑（主要ボタン・選択中） */
  --brand-primary-strong: #2E4638; /* アクセントの濃い色（押したとき） */
  --brand-accent: #EDF1EC;         /* ごく薄い緑（選択中の背景） */
  --brand-accent-line: #C9D3C8;    /* 選択肢の枠 */
  --brand-bg: #FAF8F4;             /* 画面の背景：生成り */
  --brand-surface: #FFFFFF;        /* カードの背景：白 */
  --brand-surface-soft: #F4F0E8;   /* 補助背景：薄いベージュ（表の見出し・タブ・区切り） */
  --brand-surface-highlight: #F8F5EF; /* 表の「今日」の行 */
  --brand-text: #33312D;           /* 本文：チャコールグレー */
  --brand-heading: #2B2A27;        /* 見出し */
  --brand-muted: #7B766D;          /* 補足の文字 */
  --brand-border: #E7E1D7;         /* 線・カードの枠：薄いベージュグレー */
  --brand-border-strong: #CFC7BA;  /* ボタンの枠・表の見出しの下線 */
  --brand-input-border: #DAD3C7;   /* 入力欄の枠 */
  --brand-focus: #DDE5DC;          /* 入力欄を選んだときの枠 */
  --brand-focus-ring: #A9B9AA;     /* ボタンを選んだときの枠 */
  --brand-dark: #3A3834;           /* 退勤・再計算などの濃いボタン：チャコール */
  --brand-dark-hover: #262522;
  --brand-font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  --brand-font-heading: var(--brand-font-body);
  --brand-font-display: "Georgia", "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif; /* 会社名（APP_BRAND_NAME）など */
  --brand-heading-weight: 600;
  --brand-heading-spacing: .06em;
  --brand-radius: 10px;            /* カードの角丸（控えめ） */
  --brand-radius-control: 6px;     /* ボタン・入力欄の角丸 */
  --brand-shadow: 0 1px 2px rgba(51, 49, 45, .04); /* カードの影（弱め） */
  --brand-space-card: 28px;        /* カードの内側の余白 */
  --brand-space-gap: 28px;         /* カードどうしの間隔 */
  --brand-space-card-sp: 20px;     /* スマホのカードの内側の余白 */
  --brand-space-gap-sp: 16px;      /* スマホのカードどうしの間隔 */

  /* ---------- 意味のある色（ブランドを変えても維持する） ---------- */
  --state-ok: #1F6E45;         /* 勤務中・承認済み */
  --state-ok-bg: #EAF7EF;
  --state-warn: #C26A00;       /* 中断中・承認待ち・注意 */
  --state-warn-bg: #FFF3E0;
  --state-warn-strong: #F29B30; /* 中断ボタン */
  --state-neutral: #5F6B66;    /* 退勤済み */
  --state-neutral-bg: #EEF1EF;
  --state-error: #C62828;      /* エラー・却下・要確認 */
  --state-error-bg: #FDECEC;

  /* ---------- 以前からの名前（別名。新しく書くときは --brand-* / --state-* を使う） ---------- */
  --green: var(--brand-primary);
  --green-dark: var(--brand-primary-strong);
  --green-light: var(--brand-accent);
  --green-line: var(--brand-accent-line);
  --bg: var(--brand-bg);
  --card: var(--brand-surface);
  --text: var(--brand-text);
  --text-sub: var(--brand-muted);
  --line: var(--brand-border);
  --orange: var(--state-warn);
  --orange-light: var(--state-warn-bg);
  --gray: var(--state-neutral);
  --gray-light: var(--state-neutral-bg);
  --red: var(--state-error);
  --red-light: var(--state-error-bg);
  --radius: var(--brand-radius);
  --shadow: var(--brand-shadow);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--brand-font-body);
  font-size: 16px;
  line-height: 1.6;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h2, h3, p { margin: 0; }

/* ---------- 読み込み中 ---------- */
.loading-screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: var(--brand-bg); color: var(--brand-muted); font-weight: 500; letter-spacing: .08em; z-index: 50;
}
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--brand-border); border-top-color: var(--brand-primary);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- ヘッダー ---------- */
.site-header { background: var(--card); border-bottom: 1px solid var(--line); }
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 18px var(--brand-space-gap);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 18px; }
.brand-logo { display: block; height: 56px; width: auto; max-width: 160px; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; line-height: 1.35; gap: 2px; padding-left: 18px; border-left: 1px solid var(--brand-border); }
/* 会社名は落ち着いた書体・字間を広めに。「勤怠管理」は小さく補助的に */
.brand-name { font-family: var(--brand-font-display); font-weight: 500; font-size: 20px; color: var(--brand-heading); letter-spacing: .08em; }
.brand-sub { font-size: 11px; color: var(--brand-muted); letter-spacing: .14em; }
.user-box { text-align: right; }
.user-name { font-weight: 600; font-size: 16px; letter-spacing: .04em; color: var(--brand-heading); }
.user-meta { display: flex; gap: 8px; justify-content: flex-end; align-items: center; font-size: 13px; color: var(--text-sub); flex-wrap: wrap; }
.chip {
  display: inline-block; padding: 1px 10px; border-radius: 999px;
  background: var(--brand-surface-soft); color: var(--brand-muted); font-size: 12px; font-weight: 500; letter-spacing: .04em;
}

/* ---------- レイアウト ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: var(--brand-space-gap); }
#mainContent { display: flex; flex-direction: column; gap: var(--brand-space-gap); }
.grid { display: grid; gap: var(--brand-space-gap); grid-template-columns: 1fr; }
@media (min-width: 860px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-records { grid-template-columns: minmax(280px, 2fr) 3fr; align-items: start; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-3 .staff-card { grid-column: 1 / -1; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}
@media (min-width: 1100px) {
  .grid-3 .staff-card { grid-column: 1 / -1; }
}

/* ---------- カード ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: var(--brand-space-card); min-width: 0;
}
.card-title { font-family: var(--brand-font-heading); font-size: 14px; font-weight: var(--brand-heading-weight); color: var(--brand-heading); letter-spacing: var(--brand-heading-spacing); margin-bottom: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.card-head .card-title { margin-bottom: 0; }
.card-note { font-size: 13px; color: var(--text-sub); margin-top: 10px; }
.empty { color: var(--text-sub); font-size: 14px; }
.error-text { color: var(--red); font-size: 14px; }

/* 現在日時 */
.clock-date { font-size: 18px; font-weight: 500; letter-spacing: .04em; color: var(--brand-text); }
.clock-time { font-size: 56px; font-weight: 500; line-height: 1.1; color: var(--brand-heading); font-variant-numeric: tabular-nums; letter-spacing: .04em; margin-top: 4px; }

/* 今日の勤務状況（状態ごとに色を変える） */
.status-card { display: flex; flex-direction: column; justify-content: center; transition: background .2s; }
.status-label { font-size: 34px; font-weight: 600; line-height: 1.2; letter-spacing: .04em; }
.status-sub { margin-top: 8px; color: var(--text-sub); white-space: pre-line; }
.status-notstarted { background: var(--card); }
.status-notstarted .status-label { color: var(--text-sub); }
.status-working { background: var(--state-ok-bg); border-color: #CFE3D6; }
.status-working .status-label { color: var(--state-ok); }
.status-break { background: var(--orange-light); border-color: #F5D9AE; }
.status-break .status-label { color: var(--orange); }
.status-finished { background: var(--gray-light); border-color: #DDE2DF; }
.status-finished .status-label { color: var(--gray); }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 20px; border-radius: var(--brand-radius-control); border: 1px solid transparent;
  font-weight: 600; letter-spacing: .06em; cursor: pointer; transition: background .15s, border-color .15s, color .15s, opacity .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:focus-visible, .style-option:focus-visible { outline: 3px solid var(--brand-focus-ring); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; opacity: .38; box-shadow: none; }
.btn-lg { min-height: 64px; font-size: 17px; border-radius: var(--brand-radius-control); }
.btn-sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn-primary { background: var(--brand-primary); color: #fff; }
.btn-primary:not(:disabled):hover { background: var(--brand-primary-strong); }
.btn-warn { background: var(--state-warn-strong); color: #fff; }
.btn-warn:not(:disabled):hover { background: #DB8520; }
.btn-resume { background: var(--brand-surface); color: var(--brand-primary); border-color: var(--brand-primary); }
.btn-resume:not(:disabled):hover { background: var(--brand-accent); }
.btn-dark { background: var(--brand-dark); color: #fff; }
.btn-dark:not(:disabled):hover { background: var(--brand-dark-hover); }
/* リンク・CTA風：白地に細い枠。選ぶと深緑になる */
.btn-outline { background: var(--brand-surface); color: var(--brand-text); border-color: var(--brand-border-strong); }
.btn-outline:not(:disabled):hover { border-color: var(--brand-primary); color: var(--brand-primary); background: var(--brand-surface); }
.btn-ghost { background: transparent; color: var(--brand-muted); border-color: var(--brand-border); }
.btn-ghost:not(:disabled):hover { background: var(--brand-surface-soft); color: var(--brand-text); }
.btn.is-busy { opacity: .75; cursor: progress; }
.btn .spinner { width: 18px; height: 18px; border-width: 3px; border-color: rgba(255,255,255,.5); border-top-color: #fff; }
.btn-outline .spinner, .btn-ghost .spinner, .btn-resume .spinner { border-color: var(--brand-border); border-top-color: var(--brand-primary); }

/* 打刻 */
.style-select { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.style-select-label { font-size: 14px; color: var(--text-sub); font-weight: 600; margin-right: 4px; }
.style-option {
  min-width: 96px; min-height: 44px; padding: 6px 20px; border-radius: var(--brand-radius-control); cursor: pointer;
  border: 1px solid var(--brand-border-strong); background: var(--brand-surface); color: var(--brand-text); font-weight: 600; letter-spacing: .06em;
}
.style-option[aria-checked="true"] { border-color: var(--brand-primary); background: var(--brand-accent); color: var(--brand-primary); box-shadow: inset 0 0 0 1px var(--brand-primary); }
.style-option[aria-checked="true"]::before { content: "✓ "; }
.style-option:disabled { opacity: .45; cursor: not-allowed; }
.action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.action-grid-sub { margin-top: 10px; grid-template-columns: repeat(2, 1fr); }
.break-reason { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.break-reason label { font-size: 14px; color: var(--text-sub); }
.break-reason input { flex: 1; min-width: 200px; }
.action-hint { margin-top: 12px; font-size: 14px; color: var(--text-sub); }

/* 本日の記録 */
/* タイムライン（勤務区間・中断） */
.timeline { list-style: none; margin: 0 0 10px; padding: 0; }
.timeline-item { position: relative; padding: 6px 0 6px 16px; font-size: 14px; border-left: 3px solid var(--brand-border-strong); margin-left: 4px; }
.timeline-item.style-office { border-left-color: var(--brand-primary); }
.timeline-item.style-remote { border-left-color: #6F8FAF; }
.timeline-item.style-field { border-left-color: #B08A4E; }
.timeline-item.style-break { border-left-style: dashed; color: var(--brand-muted); }
.timeline-item.style-end { border-left-color: var(--brand-dark); }
.timeline-item.timeline-now { border-left-style: dotted; color: var(--brand-muted); }
.timeline-time { display: inline-block; min-width: 4.5em; font-variant-numeric: tabular-nums; font-weight: 600; }
.segment-detail { padding: 6px 4px; }

.record-list { display: grid; grid-template-columns: auto 1fr; gap: 0; margin: 0; }
.record-list dt, .record-list dd { padding: 11px 0; border-bottom: 1px solid var(--line); margin: 0; }
.record-list dt { color: var(--text-sub); font-size: 14px; padding-right: 16px; }
.record-list dd { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--brand-heading); }
.record-list dd.big { font-size: 20px; font-weight: 600; color: var(--brand-primary); }
.record-list .muted { color: var(--text-sub); font-weight: 400; font-size: 14px; }
.subhead { font-size: 12px; font-weight: 600; color: var(--text-sub); letter-spacing: .08em; margin: 18px 0 4px; }
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;
  background: var(--gray-light); color: var(--gray);
}
.badge-working { background: var(--state-ok-bg); color: var(--state-ok); }
.badge-break { background: var(--orange-light); color: var(--orange); }
.badge-finished { background: var(--gray-light); color: var(--gray); }
.badge-notstarted { background: #fff; color: var(--text-sub); border: 1px solid var(--line); }
.badge-warn { background: var(--orange-light); color: var(--orange); }
.badge-ok { background: var(--state-ok-bg); color: var(--state-ok); }
.badge-ng { background: var(--red-light); color: var(--red); }
.badge-holiday { background: #EFE7DA; color: #7A5A2B; }
.badge-leave { background: #E6EEF4; color: #3E5F7A; }
#shiftList li.is-today { font-weight: 700; }
.check-note { margin-top: 12px; padding: 12px 14px; border-radius: var(--brand-radius-control); background: var(--orange-light); color: #7A4300; font-size: 14px; }

/* 今月の勤怠（表） */
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-label { font-weight: 600; min-width: 86px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.table-wrap { overflow: auto; max-height: 440px; border: 1px solid var(--line); border-radius: var(--brand-radius-control); -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.table th { position: sticky; top: 0; background: var(--brand-surface-soft); color: var(--brand-muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; border-bottom-color: var(--brand-border-strong); z-index: 1; }
.table tbody tr:last-child td { border-bottom: none; }
.table tr.is-today td { background: var(--brand-surface-highlight); font-weight: 600; }
.table td.sun { color: #C0392B; }
.table td.sat { color: #2463B5; }

/* フレックス累計 */
.flex-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .flex-grid { grid-template-columns: 1fr 1fr; } }
.flex-box { border: 1px solid var(--line); border-radius: var(--brand-radius); padding: 20px; background: var(--brand-surface-soft); }
.flex-box h3 { font-size: 14px; font-weight: 600; letter-spacing: .06em; color: var(--brand-heading); margin-bottom: 2px; }
.flex-range { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; }
.flex-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.flex-numbers div { background: var(--brand-surface); border: 1px solid var(--line); border-radius: var(--brand-radius-control); padding: 10px 4px; }
.flex-numbers span { display: block; font-size: 12px; color: var(--text-sub); }
.flex-numbers strong { font-size: 20px; font-weight: 600; color: var(--brand-heading); font-variant-numeric: tabular-nums; }
.flex-numbers .is-excess strong { color: var(--orange); }
.progress { height: 6px; background: var(--brand-border); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.progress-bar { height: 100%; background: var(--brand-primary); border-radius: 999px; }
.progress-bar.over { background: #F29B30; }
.flex-note { margin-top: 10px; font-size: 14px; }

/* 下のカード */
.link-card { display: flex; flex-direction: column; gap: 16px; }
.link-card p { color: var(--text-sub); font-size: 14px; flex: 1; }
.link-card .btn { align-self: flex-start; min-width: 140px; }
.env-badge { display: inline-block; margin-left: 12px; padding: 4px 10px; border-radius: 999px; background: var(--state-error-bg); color: var(--state-error);
  font-size: 12px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.link-card-actions { display: flex; gap: 10px; flex-wrap: wrap; }
/* 打刻の付帯情報（直行・現場名）／1日の詳細／交通費 */
.punch-extras { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 4px 0 14px; padding: 10px 12px; background: var(--brand-surface-soft); border-radius: var(--brand-radius-control); }
.punch-site { display: flex; align-items: center; gap: 8px; font-size: 14px; flex: 1; min-width: 220px; }
.punch-site input { flex: 1; min-width: 160px; }
.check-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.dd-segment { border: 1px solid var(--brand-border); border-radius: var(--brand-radius-control); padding: 8px 12px; margin-bottom: 10px; }
.dd-checks { display: flex; gap: 18px; margin: 4px 0 6px; }
.tr-actions { display: inline-flex; gap: 4px; margin-left: auto; }
#trList li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.link-card-actions .btn { min-width: 120px; }
.staff-list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
.staff-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.staff-list li:last-child { border-bottom: none; }
.staff-list .me { font-size: 12px; color: var(--brand-primary); margin-left: 6px; }

/* ---------- 通知 ---------- */
.toasts { position: fixed; top: 88px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100vw - 32px)); }
.toast {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--brand-radius-control);
  background: var(--brand-surface); box-shadow: 0 6px 20px rgba(51, 49, 45, .12); border-left: 4px solid var(--state-ok);
  white-space: pre-line; font-size: 15px; animation: toast-in .2s ease-out;
}
.toast-success { border-left-color: var(--state-ok); }
.toast-error { border-left-color: var(--red); background: #FFF8F8; }
.toast-warn { border-left-color: var(--state-warn-strong); background: #FFFBF4; }
.toast-text { flex: 1; }
.toast-close { border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer; color: var(--text-sub); padding: 2px 4px; }
@keyframes toast-in { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

.notice { border-radius: var(--radius); padding: 20px 24px; margin-bottom: var(--brand-space-gap); }
.notice-error { background: var(--red-light); border: 1px solid #F3C4C4; }
.notice-title { font-weight: 700; color: var(--red); }
.notice-detail { font-size: 14px; color: var(--text-sub); margin: 6px 0 12px; white-space: pre-line; }

/* ---------- フォーム・モーダル ---------- */
input[type="text"], input[type="url"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--brand-input-border); border-radius: var(--brand-radius-control); background: var(--brand-surface); min-height: 44px;
}
textarea { resize: vertical; }
